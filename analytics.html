<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #070b1f;
      --card-bg: rgba(20, 27, 58, 0.7);
      --accent: #00e5ff;
      --secondary: #8b5cf6;
      --text: #eaf2ff;
      --text-dim: rgba(234, 242, 255, 0.6);
      --border: rgba(0, 229, 255, 0.2);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(0,229,255,0.05) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(139,92,246,0.05) 0%, transparent 40%);
    }

    .login-container, .dashboard-container {
      max-width: 1200px;
      margin: auto;
    }

    .login-box {
      max-width: 400px;
      margin: 100px auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 35px;
      backdrop-filter: blur(15px);
    }

    h1 {
      color: var(--accent);
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      color: white;
      margin: 20px 0;
    }

    button {
      padding: 12px 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--secondary));
      color: white;
      font-weight: 600;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
      gap: 20px;
      margin: 30px 0;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 25px;
    }

    .value {
      font-size: 2rem;
      color: var(--accent);
      font-weight: bold;
    }

    .charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    canvas {
      width: 100% !important;
      height: 320px !important;
    }

    table {
      width: 100%;
      margin-top: 25px;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 16px;
    }

    th, td {
      padding: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      text-align: left;
    }

    th {
      color: var(--accent);
    }

    .hidden {
      display: none;
    }

    @media(max-width: 800px){
      .charts {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="login-container" id="loginBox">
  <div class="login-box">
    <h1>📊 Analytics Login</h1>
    <p>Enter admin password</p>
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Open Dashboard</button>
    <p id="error" style="color:#ff5555;margin-top:15px;"></p>
  </div>
</div>

<div class="dashboard-container hidden" id="dashboard">
  <h1>📈 Website Analytics</h1>

  <div class="stats" id="stats"></div>

  <div class="charts">
    <div class="card">
      <h3>Sessions Timeline</h3>
      <canvas id="timelineChart"></canvas>
    </div>

    <div class="card">
      <h3>Top Sections</h3>
      <canvas id="sectionChart"></canvas>
    </div>
  </div>

  <div class="card" style="margin-top:25px;">
    <h3>Recent Sessions</h3>
    <table>
      <thead>
        <tr>
          <th>Session</th>
          <th>Views</th>
          <th>Duration</th>
          <th>Platform</th>
        </tr>
      </thead>
      <tbody id="tableData"></tbody>
    </table>
  </div>
</div>

<script>
const PASSWORD = "rohitRK45";

function login(){
  const val = document.getElementById('password').value;
  if(val === PASSWORD){
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    loadData();
  } else {
    document.getElementById('error').innerText = "Incorrect password";
  }
}

function loadData(){
  const sessions = JSON.parse(localStorage.getItem('analytics-sessions') || '[]');

  const totalViews = sessions.reduce((a,b)=>a+b.pageViews,0);
  const totalDuration = sessions.reduce((a,b)=>a+b.duration,0);

  document.getElementById('stats').innerHTML = `
    <div class="card">
      <div>Total Sessions</div>
      <div class="value">${sessions.length}</div>
    </div>

    <div class="card">
      <div>Total Page Views</div>
      <div class="value">${totalViews}</div>
    </div>

    <div class="card">
      <div>Average Duration</div>
      <div class="value">${sessions.length ? Math.round(totalDuration/sessions.length) : 0}s</div>
    </div>
  `;

  const table = document.getElementById('tableData');
  table.innerHTML = sessions.slice(-10).reverse().map(s => `
    <tr>
      <td>${s.sessionId.slice(0,8)}</td>
      <td>${s.pageViews}</td>
      <td>${s.duration}s</td>
      <td>${s.deviceInfo.platform}</td>
    </tr>
  `).join('');

  const daily = {};
  sessions.forEach(s=>{
    const d = new Date(s.startTime).toLocaleDateString();
    daily[d] = (daily[d] || 0) + 1;
  });

  new Chart(document.getElementById('timelineChart'), {
    type: 'line',
    data: {
      labels: Object.keys(daily),
      datasets: [{
        label: 'Sessions',
        data: Object.values(daily),
        borderColor: '#00e5ff',
        backgroundColor: 'rgba(0,229,255,0.1)',
        fill: true,
        tension: 0.4
      }]
    }
  });

  const sections = {};
  sessions.forEach(s=>{
    (s.sectionsVisited || []).forEach(sec=>{
      sections[sec] = (sections[sec] || 0) + 1;
    });
  });

  new Chart(document.getElementById('sectionChart'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(sections),
      datasets: [{
        data: Object.values(sections),
        backgroundColor: ['#00e5ff','#8b5cf6','#22c55e','#f59e0b','#ff4444']
      }]
    }
  });
}
</script>
</body>
</html>
